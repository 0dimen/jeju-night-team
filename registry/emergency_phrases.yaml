# 사람이 위험한 상황을 말하면 다른 처리보다 먼저 112·119를 안내한다. 띄어쓰기·기호를 빼고 포함 여부로 비교한다.
# 놓치는 것보다 잘못 안내하는 편이 낫지만, 시설 제보를 막지 않도록 "강도"처럼 뜻이 여럿인 말은 상황이 드러나는 형태로만 넣는다.
phrases: [
  # 따라옴·미행
  누가 따라, 따라와요, 계속 따라와, 따라오, 따라다녀, 따라붙, 쫓아오, 쫓아와, 쫓아 와, 미행, 뒤를 밟, 스토킹, 스토커,
  # 위협·폭력
  막고 안 비켜, 막고 못 가게, 앞을 막고 계속, 소리 질러, 위협, 협박, 폭행, 때렸, 때려요, 얻어맞, 붙잡, 끌고 가, 끌려가, 납치, 시비 걸, 시비를 걸,
  칼을, 칼 들, 흉기, 강도 당, 강도를 당, 강도 만났, 뺏겼, 빼앗겼, 성추행, 성폭행, 추행, 몸을 만, 몰래 찍,
  # 도움 요청
  살려, 도와줘, 도와주세요, 도와 주세요, 지금 어떡해, 어떡해 무서, 무서워 도와, help me, following me,
  # 다침·사고·화재
  불이 났, 불났, 치였, 차에 받혔, 교통사고, 다쳤어, 피를 흘, 피가 나, 의식이 없, 의식 없, 숨을 안 쉬, 숨을 못 쉬,
]
# 쓰러짐·누움은 사람일 때만 긴급이다. 사물 이름이 있고 사람을 가리키는 말이 없으면 시설 제보로 둔다.
fall_phrases: [쓰러져, 쓰러졌, 쓰러진, 누워 있, 누워있]
object_words: [표지판, 안내판, 나무, 가로등, 보안등, 기둥, 전봇대, 전신주, 펜스, 울타리, 간판, 화분, 자전거, 킥보드, 신호등, 볼라드, 라바콘, 안전봉, 쓰레기통, 현수막, 배너]
person_words: [사람, 아이, 애가, 할머니, 할아버지, 친구, 남자, 여자, 학생, 노인, 어르신, 분이, 분께서]
message: '긴급한 상황이면 먼저 112에, 다치거나 쓰러진 사람이 있으면 119에 신고하세요. 이 서비스는 긴급 신고를 접수하지 않습니다.'
